# Fork identity: a different appId and productName keep this app apart from
# an installed upstream The Human Box (its own userData folder, single-instance
# lock and /Applications bundle), and the update feed below is this fork's.
appId: com.alklimover.thehumanbox
productName: The Human Box RU
copyright: Copyright © 2026 Mohamad Homsi; Russian fork © 2026 alklimover

directories:
  output: out
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.{ts,map,md}"

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: build/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.{node,dll,dylib,so}"

publish:
  - provider: github
    owner: alklimover
    repo: thehumanbox
    releaseType: release

mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.simulation-games
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  notarize: false
  icon: build/icon.icns

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Game
  synopsis: The Human Box — a living simulation
  description: |
    The Human Box is a tribal-to-civic simulation where every organism
    has memory, dreams, relationships, and a lineage. The simulation
    and its worlds run locally on the player's computer.
  icon: build/icon.png
