  <style>
    /* Boot splash. It shows before any app CSS loads, so it carries its own
       copy of the pixel palette. One solid surface, no card: the logo, bar,
       and status sit directly on the background. */
    html, body { margin: 0; padding: 0; background: #1a130d; color: #e7d8bc; font-family: ui-monospace, Menlo, monospace; }
    #thb-splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #1a130d;
      z-index: 9999; transition: opacity 360ms ease;
    }
    #thb-splash.hide { opacity: 0; pointer-events: none; }
    #thb-splash .thb-frame {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      width: min(300px, calc(100vw - 48px));
    }
    #thb-splash .thb-logo { filter: drop-shadow(0 3px 0 #000); animation: thb-bob 2.4s steps(2, end) infinite; }
    @keyframes thb-bob { 50% { transform: translateY(-3px); } }
    #thb-splash h1 {
      margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      color: #f3d17a; text-shadow: 0 2px 0 #000;
    }
    #thb-splash .thb-progress {
      width: 100%; height: 18px; position: relative; overflow: hidden; box-sizing: border-box;
      background: #1a130d; border: 2px solid #110c08;
      box-shadow: inset 2px 2px 0 rgba(0,0,0,.45), inset -1px -1px 0 rgba(255,255,255,.06);
    }
    #thb-splash .thb-progress-bar {
      position: absolute; left: 2px; top: 2px; bottom: 2px; width: 0%;
      background: repeating-linear-gradient(90deg, #e8b64c 0 8px, #b98a36 8px 10px);
      transition: width 180ms steps(6, end);
    }
    /* Indeterminate: a short run of blocks steps across the bar. */
    #thb-splash .thb-progress.indeterminate .thb-progress-bar {
      width: 30%; animation: thb-slide 1.6s steps(16, end) infinite;
    }
    @keyframes thb-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }
    #thb-splash .thb-sub {
      font-size: 11px; letter-spacing: 0.1em; color: #9d8c6e; text-transform: lowercase; min-height: 1.4em;
    }
    #thb-splash .thb-hint {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      font-size: 11px; letter-spacing: 0.04em; color: #9d8c6e; text-align: center; line-height: 1.5;
      opacity: 0; transition: opacity 600ms ease;
    }
    #thb-splash .thb-hint.show { opacity: 1; }
    #thb-splash .thb-hint button {
      font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      padding: 6px 16px; color: #e7d8bc; background: #45362a; border: 2px solid #110c08;
      box-shadow: inset 2px 2px 0 #6a5439, inset -2px -3px 0 #2a1f15;
    }
    #thb-splash .thb-hint button:hover { background: #54422f; color: #fff3d6; }
    #thb-splash .thb-hint button:active { box-shadow: inset 2px 3px 0 #2a1f15, inset -2px -2px 0 #6a5439; }
    @media (prefers-reduced-motion: reduce) {
      #thb-splash .thb-logo, #thb-splash .thb-progress.indeterminate .thb-progress-bar { animation: none; }
    }
  </style>
</head>
