<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Human Box · home sprite catalog</title>
    <style>
      body { margin: 24px; background: #20272b; color: #eee8d8; font: 15px system-ui; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { color: #b5c3c3; }
      nav { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin: 24px 0; }
      select, button { font: inherit; padding: 6px 10px; background: #343e42; color: inherit; border: 1px solid #617472; border-radius: 4px; }
      label { display: flex; gap: 8px; align-items: center; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
      figure { margin: 0; background: #2c3538; border: 1px solid #48534f; border-radius: 5px; }
      canvas { display: block; margin: auto; image-rendering: pixelated; width: 176px; height: 156px; }
      figcaption { padding: 8px 12px 12px; font-size: 13px; }
      small { display: block; color: #a7bbb7; margin-top: 5px; }
      #report { white-space: pre-wrap; font: 13px monospace; }
    </style>
  </head>
  <body>
    <h1>The Human Box · 1,050 new homes</h1>
    <p>30 homes for each of 35 eras. These are the same Canvas sprites used on the world map.</p>
    <nav>
      <label>Era <select id="era"></select></label>
      <label><input id="night" type="checkbox" /> Night</label>
      <label><input id="damaged" type="checkbox" /> Damaged</label>
      <button id="verify">Verify all sprites</button>
    </nav>
    <div id="report" role="status"></div>
    <main id="homes"></main>
    <script type="module" src="/src/dev/home-catalog.ts"></script>
  </body>
</html>
