  <meta name="twitter:title"       content="The Human Box - a live emergent simulation of language, lineage, and civilisation" />

  <!-- ── Theme colour (Android Chrome / iOS PWA) ── -->
  <meta name="theme-color" content="#1a4a80" />

  <style>
    html, body { margin: 0; padding: 0; background: #0c0a08; color: #c8c0b0; font-family: ui-sans-serif, system-ui, sans-serif; }
    #thb-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at center, #14110d 0%, #07060a 100%);
      z-index: 9999;
      transition: opacity 360ms ease;
    }
    #thb-splash.hide { opacity: 0; pointer-events: none; }
    #thb-splash h1 {
      margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.18em;
      color: #d8d2c4; text-transform: uppercase;
    }
    #thb-splash .thb-sub {
      font-size: 11px; letter-spacing: 0.12em; color: #5e5648;
      text-transform: uppercase;
    }
    #thb-splash .thb-progress {
      width: 240px; height: 4px; background: #1c1612;
      border-radius: 2px; overflow: hidden; position: relative;
    }
    #thb-splash .thb-progress-bar {
      position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
      background: linear-gradient(90deg, #7eb96b, #b8e088);
      transition: width 180ms ease-out;
    }
    /* Indeterminate state - bar slides while total size unknown. */
    #thb-splash .thb-progress.indeterminate .thb-progress-bar {
      width: 35%; animation: thb-slide 1.4s ease-in-out infinite;
    }
    @keyframes thb-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }
    #thb-splash .thb-hint {
      font-size: 11px; letter-spacing: 0.06em; color: #8a7a5a; max-width: 320px;
      text-align: center; opacity: 0; transition: opacity 600ms ease; line-height: 1.5;
    }
    #thb-splash .thb-hint.show { opacity: 1; }
    #thb-splash .thb-hint button {
      background: #1c1612; color: #d8d2c4; border: 1px solid #3a3228; padding: 6px 14px;
      border-radius: 4px; font-size: 11px; letter-spacing: 0.12em; cursor: pointer;
      text-transform: uppercase; margin-top: 8px; font-family: inherit;
    }
    #thb-splash .thb-hint button:hover { background: #2a221c; border-color: #5e5648; }
  </style>
</head>

<body>
  <div id="thb-splash">
    <h1>The Human Box</h1>
    <div class="thb-progress indeterminate" aria-hidden="true">
      <div class="thb-progress-bar" id="thb-progress-bar"></div>
    </div>
    <div class="thb-sub" id="thb-progress-text">downloading…</div>
    <div class="thb-hint" id="thb-splash-hint" aria-live="polite">
      taking longer than usual<br/>
      <button type="button" id="thb-splash-reload">reload</button>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
