[package]
name = "sim-core"
version = "0.2.38"
edition = "2021"

[lib]
# rlib for the native server/headless consumers; cdylib so the wasm
# facade crate can produce a loadable module.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
rand        = { version = "0.9", features = ["small_rng"] }
rand_chacha = { version = "0.9", features = ["serde"] }
rand_distr  = "0.5"
uuid        = { version = "1", features = ["v4"] }
tracing     = "0.1"

# On wasm32, uuid v4 + the rand stack need browser entropy via getrandom's
# "js" backend. This is a no-op for native targets.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
