[package]
name = "simulation-rs"
version = "0.0.51"
edition = "2021"

[[bin]]
name = "simulation-rs"
path = "main.rs"

[[bin]]
name = "headless"
path = "bin/headless.rs"

[dependencies]
tokio       = { version = "1",   features = ["full"] }
axum        = { version = "0.7", features = ["ws"] }
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
rmp-serde   = "1.3"
rand        = { version = "0.8", features = ["small_rng"] }
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr  = "0.4"
uuid        = { version = "1",   features = ["v4"] }
tower-http  = { version = "0.5", features = ["cors", "compression-gzip"] }
reqwest     = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dotenvy     = "0.15"

# Optional WebTransport / HTTP/3 path. Off by default - enable with
# --features webtransport once a TLS cert is available and the deploy
# is ready to drop the WS-through-Cloudflare-Tunnel hop. See
# docs/TRANSPORT.md for the migration plan.
wtransport  = { version = "0.6", optional = true }

[features]
default = []
webtransport = ["dep:wtransport"]
