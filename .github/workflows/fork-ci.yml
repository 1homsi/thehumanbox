name: fork-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fork CI: checks only. Upstream's pipeline.yml (version bump, release
# cutting, Cloudflare deploys) is deleted in this fork; when an upstream merge
# touches it, keep it deleted. Desktop installers are built by
# fork-release.yml. PR runs are cancellable so a new push supersedes them.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which suites to run. A PR runs the suites whose inputs it changed; a push
  # to main runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sim: ${{ steps.plan.outputs.sim }}
      client: ${{ steps.plan.outputs.client }}
      desktop: ${{ steps.plan.outputs.desktop }}
      build_client: ${{ steps.plan.outputs.build_client }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        if: ${{ github.event_name == 'pull_request' }}
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/**'
              - 'Makefile'
              - 'scripts/source-key.sh'
            sim:
              - *ci
              - 'apps/server/**'
              - 'crates/**'
              - 'Cargo.*'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'scripts/perf-gate.sh'
              - 'scripts/determinism-fingerprint.json'
            client:
              - *ci
              - 'apps/web/**'
              - 'crates/sim-core/**'
              - 'Cargo.*'
              - '.node-version'
              - 'scripts/build-wasm.sh'
              - 'scripts/check-wasm-determinism.mjs'
              - 'scripts/determinism-fingerprint.json'
            desktop:
              - *ci
              - 'apps/desktop/**'
              - '.node-version'
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SIM: ${{ steps.filter.outputs.sim }}
          CLIENT: ${{ steps.filter.outputs.client }}
          DESKTOP: ${{ steps.filter.outputs.desktop }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            plan=(sim="$SIM" client="$CLIENT" desktop="$DESKTOP" build_client="$CLIENT")
          else
            plan=(sim=true client=true desktop=true build_client=true)
          fi
          echo "${plan[*]}"
          printf '%s\n' "${plan[@]}" >> "$GITHUB_OUTPUT"

  simulation-lint:
    name: Simulation lint (fmt + clippy)
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The suite is about 20 CPU-minutes, so one 4-core runner took 6 minutes
  # to run it after compiling. Each shard compiles the tests (cached deps) and
  # runs a third of them with cargo-nextest, which also runs every test
  # binary at once instead of one binary after another.
  simulation-tests:
    name: Simulation tests (shard ${{ matrix.shard }}/3)
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo nextest run --release --locked --workspace (one shard)
        # --workspace so the sim-core crate's tests run too (the bulk of the
        # suite lives there after the core was split out for the wasm build).
        run: cargo nextest run --release --locked --workspace --no-fail-fast --partition hash:${{ matrix.shard }}/3
      # nextest does not run doc tests.
      - name: cargo test --doc
        if: matrix.shard == 1
        run: cargo test --release --locked --workspace --doc

  simulation-performance:
    name: Simulation performance budget
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TICKS: 8000
      MAX_TICK_MS: 80
      MAX_RSS_MB: 256
      SEEDS: "42 1337 2026"
      # This also covers the old headless smoke test: seed 42 runs 8000 ticks.
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build headless benchmark
        run: cargo build --release --locked --bin headless
      - name: Enforce multi-seed tick budget
        run: scripts/perf-gate.sh

  test-frontend:
    name: Test frontend
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: pnpm lint
        working-directory: apps/web
        run: pnpm lint

      - name: pnpm format:check
        working-directory: apps/web
        run: pnpm format:check

      - name: pnpm test
        working-directory: apps/web
        run: pnpm test

  build-wasm:
    name: Build wasm sim-core
    needs: [changes]
    if: ${{ needs.changes.outputs.build_client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@v7

      # The wasm only depends on sim-core and its locked deps, so an unchanged
      # source tree restores the previous build instead of a 5 minute compile.
      # Every release bumps the simulation-rs version in Cargo.toml and
      # Cargo.lock, which does not change the wasm, so those lines are left
      # out of the key.
      - name: Compute wasm cache key
        id: wasm-key
        run: |
          {
            find crates/sim-core -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum
            sed '/^name = "simulation-rs"$/{n;d;}' Cargo.lock
            grep -v '^version = ' apps/server/Cargo.toml
            cat Cargo.toml scripts/build-wasm.sh
          } | sha256sum | cut -c1-32 > /tmp/wasm-key
          echo "key=wasm-sim-core-$(cat /tmp/wasm-key)" >> "$GITHUB_OUTPUT"
      - name: Restore wasm build
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: apps/web/src/wasm/sim-core
          key: ${{ steps.wasm-key.outputs.key }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          workspaces: . -> target
      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm sim-core
        id: wasm-build
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh
      # The browser sim must reproduce the committed native fingerprint (see
      # scripts/determinism-fingerprint.json). Runs on cached and fresh builds.
      - name: Check wasm determinism fingerprint
        run: node scripts/check-wasm-determinism.mjs apps/web/src/wasm/sim-core
      - uses: actions/upload-artifact@v7
        with:
          name: sim-core-wasm
          path: apps/web/src/wasm/sim-core
          retention-days: 7

  build-frontend:
    name: Build frontend
    needs: [changes, test-frontend, build-wasm]
    if: >-
      ${{ !cancelled()
        && needs.changes.outputs.build_client == 'true'
        && needs.build-wasm.result == 'success'
        && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Download wasm sim-core
        uses: actions/download-artifact@v8
        with:
          name: sim-core-wasm
          path: apps/web/src/wasm/sim-core

      - name: pnpm run build
        working-directory: apps/web
        run: pnpm run build
        env:
          VITE_GIT_SHA:      ${{ github.sha }}
          VITE_BUILD_TS:     ${{ steps.ts.outputs.build_ts }}

  test-desktop:
    name: Typecheck desktop
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: apps/desktop
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: desktop main-process tests
        working-directory: apps/desktop
        run: pnpm run test:main
