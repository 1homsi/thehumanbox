name: pipeline

# Single workflow from a human push to a live deploy.
#
# Stages, in order:
#   1. test-backend         x86 runner runs cargo test --release.
#   2. test-frontend        pnpm build, uploads dist artifact.
#   3. build-backend-binary aarch64 runner produces the production
#                            simulation-rs binary, uploads as artifact.
#                            Runs in parallel with tests.
#   4. bump-version         Bumps the patch version + commits to main
#                            with [skip-bump] sentinel. Waits for tests.
#   5. publish-release      Creates GitHub release v$NEW with the
#                            aarch64 binary attached.
#   6. deploy-backend       SSMs EC2 to run /root/thehumanbox/update.sh
#                            $NEW - which curls the binary from the
#                            release + restarts the systemd unit. NO
#                            on-box compile. The c7g.medium does not
#                            have enough RAM to run rustc.
#   7. deploy-frontend      Downloads dist artifact, wrangler-deploys.
#
# A bot push ([skip-bump] in the message) re-fires this workflow but
# every job's `if:` short-circuits it to a no-op.

on:
  push:
    branches: [main]
  workflow_dispatch:

#
# Concurrency: every push gets its own concurrency group (keyed on
# the commit SHA), so different commits don't share + don't cancel
# each other. The pre-existing behaviour of "newer push cancels the
# QUEUED older push" was losing intermediate deploys whenever pushes
# came in rapid succession.
#
# Race we DO need to serialise: bump-version (parallel pipelines
# would both try to push a [skip-bump] commit and step on each
# other). That's gated per-job below.
concurrency:
  group: pipeline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Stage 1: smoke tests + production binary build. All three run in parallel.
  # ────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Test backend
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    # 25 min: the 60k-tick population_does_not_reconverge_after_many_sim_days
    # test is the long pole at ~5 min, and cold-cache compile is ~7 min.
    # A 15-min cap was tripping right at the edge.
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
      - name: cargo test --release --locked
        working-directory: simulation
        run: cargo test --release --locked

  test-frontend:
    name: Test + build frontend
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: pnpm install
        working-directory: client
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: pnpm run build
        working-directory: client
        run: pnpm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_GIT_SHA:  ${{ github.sha }}
          VITE_BUILD_TS: ${{ steps.ts.outputs.build_ts }}

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Stage 2: version bump. Runs after tests are green. MUST run BEFORE
  # build-backend-binary so the binary that lands in the GitHub release
  # has the SAME version embedded as the release tag - otherwise the
  # binary self-reports a version one bump behind its release.
  # ────────────────────────────────────────────────────────────────────────
  bump-version:
    name: Bump version
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # Serialise bump-version + everything downstream across all
    # pipelines on main. Two parallel pipelines would both try to
    # bump Cargo.toml and push a [skip-bump] commit, racing. With
    # `cancel-in-progress: false` the second waits its turn, then
    # bumps from the now-updated Cargo.toml so versions never
    # collide.
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    outputs:
      new: ${{ steps.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute + apply patch bump
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version = ' simulation/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $CURRENT -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          sed -i -E "0,/^version = \"[^\"]+\"$/s//version = \"$NEW\"/" simulation/Cargo.toml

          awk -v new="$NEW" '
            /^name = "simulation-rs"$/ { hit = 1; print; next }
            hit && /^version = / { sub(/"[^"]+"/, "\"" new "\""); hit = 0 }
            { print }
          ' simulation/Cargo.lock > simulation/Cargo.lock.tmp
          mv simulation/Cargo.lock.tmp simulation/Cargo.lock

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' client/package.json > "$tmp" && mv "$tmp" client/package.json

      - name: Commit + push as bump bot
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name  "thb-bumpbot"
          git config user.email "bumpbot@thehumanbox.com"
          git add simulation/Cargo.toml simulation/Cargo.lock client/package.json
          git commit -m "chore: release $NEW [skip-bump]"
          git pull --rebase origin main
          git push

  # Build the linux-aarch64 release binary AT THE BUMPED COMMIT.
  # This runs after bump-version (rather than in parallel with tests
  # like the very first iteration of this workflow) so the binary
  # embeds the same version number as the release tag it'll be
  # attached to. Without this ordering the binary self-reports a
  # version one bump behind whatever the GitHub release is tagged
  # as - confirmed live: a v0.0.76 release contained a binary whose
  # /version endpoint said "0.0.75".
  build-backend-binary:
    name: Build backend binary (aarch64, at bumped commit)
    needs: [bump-version]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # Same serialising group as bump-version - inherits the queue.
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out main rather than the commit that triggered the
          # workflow - we need the bump-version commit that just landed.
          ref: main
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
          key: aarch64-release
      - name: Verify version matches expected
        env:
          NEW: ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          ACTUAL=$(grep '^version = ' simulation/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$ACTUAL" != "$NEW" ]]; then
            echo "Cargo.toml says version=$ACTUAL but expected $NEW - did the bump push not land?" >&2
            exit 1
          fi
          echo "OK: building binary with embedded version $ACTUAL"
      - name: cargo build --release --bin simulation-rs
        working-directory: simulation
        run: cargo build --release --locked --bin simulation-rs
      - name: Strip binary
        run: |
          strip simulation/target/release/simulation-rs
          ls -lh simulation/target/release/simulation-rs
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-rs-aarch64
          path: simulation/target/release/simulation-rs
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────
  # Stage 3: publish a GitHub release tagged v$NEW with the binary attached.
  # ────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish release with aarch64 binary
    needs: [bump-version, build-backend-binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: simulation-rs-aarch64
          path: ./bin
      - name: Make binary executable
        run: chmod +x ./bin/simulation-rs
      - name: Create release + attach binary (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW:      ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          # IDEMPOTENT: if the release already exists (typically because
          # a previous pipeline run got cancelled after it created the
          # tag but before deploy), we replace the binary rather than
          # fail. Without this, a single cancelled run blocks every
          # subsequent run forever on `tag already exists` and the
          # deploy chain just stops carrying new code to the EC2.
          if gh release view "v$NEW" >/dev/null 2>&1; then
            echo "Release v$NEW already exists - replacing binary"
            gh release upload "v$NEW" ./bin/simulation-rs --clobber
          else
            echo "Creating release v$NEW"
            # --target=main so the release is anchored to the merged
            # main branch tip (which includes the [skip-bump] commit by
            # the time this job runs).
            gh release create "v$NEW" \
              --title "v$NEW" \
              --notes "Automated release. Backend binary built on ubuntu-24.04-arm runner; SHA ${GITHUB_SHA}." \
              --target main \
              ./bin/simulation-rs
          fi

  # ────────────────────────────────────────────────────────────────────────
  # Stage 4: deploys. Run in parallel after publish-release succeeds.
  # ────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend (SSM, no on-box compile)
    needs: [bump-version, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM deploy command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          NEW_VERSION: ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          # EC2 runs update.sh, which: pulls the version's binary from
          # the GitHub release, atomically swaps it in, restarts the
          # systemd unit. No rustc on the box. Build time on the box
          # used to peak ~1.5 GB and OOM'd the c7g.medium yesterday.
          #
          # update.sh lives in the repo and is git-pulled by EC2 in
          # the same SSM step, so changes to the deploy procedure
          # ride along with normal pushes.
          DEPLOY_CMD="cd /root/thehumanbox && git pull --ff-only && chmod +x scripts/update.sh && scripts/update.sh ${NEW_VERSION}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy v$NEW_VERSION (gh-release binary)" \
            --parameters "commands=[\"$DEPLOY_CMD\"]" \
            --output text --query 'Command.CommandId')
          echo "SSM command dispatched: $CMD_ID"
          echo "Track: https://${{ vars.AWS_REGION }}.console.aws.amazon.com/systems-manager/run-command/$CMD_ID"

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    needs: bump-version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents:    read
      deployments: write
    steps:
      - name: Download dist/ from test-frontend
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy client/dist --project-name=thehumanbox --branch=main
