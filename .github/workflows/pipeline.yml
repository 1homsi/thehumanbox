name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR runs are cancellable so that pushing new commits to a PR
# supersedes the prior run. Main runs serialize (bump-version /
# build / deploy chain must run in order without losing one).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the repo a PR touches. Pushes to main always run
  # everything; PRs skip suites whose inputs did not change.
  changes:
    name: Detect changed areas
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sim: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sim == 'true' }}
      client: ${{ github.event_name != 'pull_request' || steps.filter.outputs.client == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
      lab: ${{ github.event_name != 'pull_request' || steps.filter.outputs.lab == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ci: &ci
              - '.github/**'
              - 'Makefile'
            sim:
              - *ci
              - 'simulation/**'
              - 'scripts/perf-gate.sh'
            client:
              - *ci
              - 'client/**'
              - 'simulation/sim-core/**'
              - 'simulation/Cargo.*'
            desktop:
              - *ci
              - 'desktop/**'
            lab:
              - *ci
              - 'lab/**'

  simulation-lint:
    name: Simulation lint (fmt + clippy)
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
      - name: cargo fmt --check
        working-directory: simulation
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: simulation
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  simulation-tests:
    name: Simulation tests (release workspace)
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
      - name: cargo test --release --locked --workspace
        working-directory: simulation
        # --workspace so the sim-core crate's tests run too (the bulk of the
        # suite lives there after the core was split out for the wasm build).
        run: cargo test --release --locked --workspace

  simulation-performance:
    name: Simulation performance budget
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TICKS: 8000
      MAX_TICK_MS: 80
      MAX_RSS_MB: 256
      SEEDS: "42 1337 2026"
      # This also covers the old headless smoke test: seed 42 runs 8000 ticks.
    steps:
      - uses: actions/checkout@v7
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
      - name: Build headless benchmark
        working-directory: simulation
        run: cargo build --release --locked --bin headless
      - name: Enforce multi-seed tick budget
        run: scripts/perf-gate.sh

  test-frontend:
    name: Test frontend
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: pnpm install
        working-directory: client
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: pnpm lint
        working-directory: client
        run: pnpm lint

      - name: pnpm format:check
        working-directory: client
        run: pnpm format:check

      - name: pnpm test
        working-directory: client
        run: pnpm test

  build-wasm:
    name: Build wasm sim-core
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@v7

      # The wasm only depends on sim-core and its locked deps, so an unchanged
      # source tree restores the previous build instead of a 5 minute compile.
      # Every release bumps the simulation-rs version in Cargo.toml and
      # Cargo.lock, which does not change the wasm, so those lines are left
      # out of the key.
      - name: Compute wasm cache key
        id: wasm-key
        run: |
          {
            find simulation/sim-core -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum
            sed '/^name = "simulation-rs"$/{n;d;}' simulation/Cargo.lock
            grep -v '^version = ' simulation/Cargo.toml
          } | sha256sum | cut -c1-32 > /tmp/wasm-key
          echo "key=wasm-sim-core-$(cat /tmp/wasm-key)" >> "$GITHUB_OUTPUT"
      - name: Restore wasm build
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: client/src/wasm/sim-core
          key: ${{ steps.wasm-key.outputs.key }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        with:
          workspaces: simulation -> target
      - name: Install wasm-pack
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm sim-core
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        working-directory: simulation
        run: |
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' \
            wasm-pack build sim-core --target web --release \
            --out-dir ../../client/src/wasm/sim-core
      - uses: actions/upload-artifact@v7
        with:
          name: sim-core-wasm
          path: client/src/wasm/sim-core
          retention-days: 7

  build-frontend:
    name: Build frontend
    needs: [changes, test-frontend, build-wasm]
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: pnpm install
        working-directory: client
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Download wasm sim-core
        uses: actions/download-artifact@v8
        with:
          name: sim-core-wasm
          path: client/src/wasm/sim-core

      - name: pnpm run build
        working-directory: client
        run: pnpm run build
        env:
          VITE_GIT_SHA:      ${{ github.sha }}
          VITE_BUILD_TS:     ${{ steps.ts.outputs.build_ts }}
          # PostHog analytics. Token + host pulled from repo secrets so
          # the key never lands in the repo. Build-time injection means
          # the bundle only includes them on prod CI builds — local
          # `pnpm dev` reads the developer's own .env (or simply doesn't
          # initialize, see analytics.ts).
          VITE_POSTHOG_KEY:  ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  test-desktop:
    name: Typecheck desktop
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: pnpm install
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: desktop
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: desktop main-process tests
        working-directory: desktop
        run: pnpm run test:main

  test-lab:
    name: Test lab
    needs: [changes]
    if: ${{ needs.changes.outputs.lab == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: lab/pyproject.toml
      - name: Install lab
        working-directory: lab
        run: python -m pip install -e '.[dev]'
      - name: ruff check
        working-directory: lab
        run: python -m ruff check .
      - name: pytest
        working-directory: lab
        run: python -m pytest

  bump-version:
    name: Bump version
    # Only runs for direct pushes to main (post-merge). PRs go through
    # the test jobs only — no version bump, no deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    outputs:
      new: ${{ steps.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - name: Compute + apply patch bump
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version = ' simulation/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          # Rollover scheme: patch increments to 99, then jumps to next
          # minor with patch reset to 0. e.g. 0.0.99 -> 0.1.0, 0.1.99 -> 0.2.0.
          # Minor rolls over the same way: 0.99.99 -> 1.0.0.
          NEW_PATCH=$((PATCH + 1))
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR
          if [ "$NEW_PATCH" -gt 99 ]; then
            NEW_PATCH=0
            NEW_MINOR=$((MINOR + 1))
            if [ "$NEW_MINOR" -gt 99 ]; then
              NEW_MINOR=0
              NEW_MAJOR=$((MAJOR + 1))
            fi
          fi
          NEW="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "Bumping $CURRENT -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          sed -i -E "0,/^version = \"[^\"]+\"$/s//version = \"$NEW\"/" simulation/Cargo.toml

          awk -v new="$NEW" '
            /^name = "simulation-rs"$/ { hit = 1; print; next }
            hit && /^version = / { sub(/"[^"]+"/, "\"" new "\""); hit = 0 }
            { print }
          ' simulation/Cargo.lock > simulation/Cargo.lock.tmp
          mv simulation/Cargo.lock.tmp simulation/Cargo.lock

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' client/package.json > "$tmp" && mv "$tmp" client/package.json

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' desktop/package.json > "$tmp" && mv "$tmp" desktop/package.json

      - name: Commit + push as bump bot
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name  "thb-bumpbot"
          git config user.email "bumpbot@thehumanbox.com"
          git add simulation/Cargo.toml simulation/Cargo.lock client/package.json desktop/package.json
          git commit -m "chore: release $NEW [skip-bump]"
          git pull --rebase origin main
          git push

  release-gate:
    name: Release gate (all checks completed)
    # always() so the gate decides from the results itself. Every suite runs
    # on main, so anything other than success blocks the release.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-bump]') }}
    needs: [changes, simulation-lint, simulation-tests, simulation-performance, test-frontend, build-wasm, build-frontend, test-desktop, test-lab]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm release prerequisites
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "a required check did not succeed ($result)" >&2
              exit 1
            fi
          done
          echo "All test, wasm, frontend, desktop, and lab checks completed successfully."

  publish-release:
    name: Publish desktop release
    needs: [bump-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Create release for desktop installers (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW:      ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          if gh release view "v$NEW" >/dev/null 2>&1; then
            echo "Release v$NEW already exists"
          else
            echo "Creating release v$NEW"
            gh release create "v$NEW" \
              --title "v$NEW" \
              --notes "Automated desktop release. Native installers run the simulation locally; SHA ${GITHUB_SHA}." \
              --target main
          fi

  build-desktop:
    name: Build desktop installers + attach to release
    needs: [bump-version, publish-release]
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag:     v${{ needs.bump-version.outputs.new }}
      version: ${{ needs.bump-version.outputs.new }}

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    needs: [bump-version, build-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents:    read
      deployments: write
    steps:
      - name: Download static frontend
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: client/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: client
          command: pages deploy dist --project-name=thehumanbox --branch=main
