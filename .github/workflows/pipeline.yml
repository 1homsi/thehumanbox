name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR runs are cancellable so that pushing new commits to a PR
# supersedes the prior run. Main runs serialize (bump-version /
# build / deploy chain must run in order without losing one). The
# desktop installers run in their own workflow, so a main run is done
# once the release is cut and never holds the next merge back.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which suites to run. They fall in three areas, each keyed by
  # scripts/source-key.sh over the area's inputs (the key ignores the release
  # bot's version stamps):
  #
  #   sim      simulation-lint, simulation-tests, simulation-performance
  #   client   test-frontend, build-wasm, build-frontend
  #   desktop  test-desktop
  #
  # A run that passes an area leaves a `pass-<area>-<key>` artifact (see
  # record-passes), and a later run, PR or main, skips any area whose key
  # already passed: its suites would rerun on identical inputs. So a merge
  # reruns only the areas whose inputs no run has checked yet, which matters
  # when PRs land back to back: each merged tree then differs from the one
  # its PR tested, and main used to rerun every suite. A PR also skips the
  # areas it did not change, and a manual run (workflow_dispatch) runs all.
  changes:
    name: Detect changed areas
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sim: ${{ steps.plan.outputs.sim }}
      client: ${{ steps.plan.outputs.client }}
      desktop: ${{ steps.plan.outputs.desktop }}
      build_client: ${{ steps.plan.outputs.build_client }}
      sim_key: ${{ steps.keys.outputs.sim_key }}
      client_key: ${{ steps.keys.outputs.client_key }}
      desktop_key: ${{ steps.keys.outputs.desktop_key }}
      sim_run: ${{ steps.passed.outputs.sim_run }}
      client_run: ${{ steps.passed.outputs.client_run }}
      desktop_run: ${{ steps.passed.outputs.desktop_run }}
      bundle: ${{ steps.passed.outputs.bundle }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR checks out its merge commit; the first parent is the base.
          fetch-depth: 2
      - name: Area keys
        id: keys
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # This file decides how every suite runs; the other workflows,
          # Dependabot's config and the Makefile (CI never runs make) do not
          # touch them.
          ci=(.github/workflows/pipeline.yml scripts/source-key.sh)
          sim=("${ci[@]}" .config apps/server crates Cargo.toml Cargo.lock rustfmt.toml clippy.toml
            scripts/perf-gate.sh scripts/build-wasm.sh scripts/build-wasm-threads.sh scripts/check-wasm-determinism.mjs)
          client=("${ci[@]}" apps/web crates/sim-core Cargo.toml Cargo.lock .node-version
            scripts/build-wasm.sh scripts/build-wasm-threads.sh scripts/check-wasm-determinism.mjs)
          desktop=("${ci[@]}" apps/desktop .node-version)
          base=""
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            base='HEAD^1'
          fi
          key() {
            local area=$1 key changed=true
            shift
            key=$(scripts/source-key.sh "$@")
            if [ -n "$base" ] && [ "$key" = "$(SOURCE_KEY_REV=$base scripts/source-key.sh "$@")" ]; then
              changed=false
            fi
            echo "$area: $key${base:+ (changed from the base: $changed)}"
            printf '%s_key=%s\n%s_changed=%s\n' "$area" "$key" "$area" "$changed" >> "$GITHUB_OUTPUT"
          }
          key sim "${sim[@]}"
          key client "${client[@]}"
          key desktop "${desktop[@]}"
      - name: Find runs that already passed these keys
        id: passed
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO_ID: ${{ github.repository_id }}
          SIM_KEY: ${{ steps.keys.outputs.sim_key }}
          CLIENT_KEY: ${{ steps.keys.outputs.client_key }}
          DESKTOP_KEY: ${{ steps.keys.outputs.desktop_key }}
        run: |
          set -uo pipefail
          # Prints the newest run of this workflow that left the record. Only
          # runs from this repository count, so a fork cannot vouch for
          # anything. An API failure prints nothing, which runs the area.
          passed_by() {
            local run
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=20" --jq "
                [.artifacts[] | select(.expired == false
                  and .workflow_run.repository_id == $REPO_ID
                  and .workflow_run.head_repository_id == $REPO_ID)]
                | sort_by(.created_at) | reverse | .[].workflow_run.id"); do
              if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .path)" = .github/workflows/pipeline.yml ]; then
                echo "$run"
                return
              fi
            done
          }
          sim_run=$(passed_by "pass-sim-$SIM_KEY")
          client_run=$(passed_by "pass-client-$CLIENT_KEY")
          desktop_run=$(passed_by "pass-desktop-$DESKTOP_KEY")
          # That client run's bundle ships as is (ship-web) when it has one: a
          # PR run uploads client-dist only when it is the production bundle
          # (built with the analytics key).
          bundle=false
          if [ "$EVENT" = push ] && [ -n "$client_run" ]; then
            bundle=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$client_run/artifacts?name=client-dist" \
              --jq '[.artifacts[] | select(.expired == false)] | length > 0') || bundle=false
          fi
          echo "passed in run: sim ${sim_run:-none}, client ${client_run:-none} (bundle: $bundle), desktop ${desktop_run:-none}"
          printf '%s\n' "sim_run=$sim_run" "client_run=$client_run" "desktop_run=$desktop_run" "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SIM_CHANGED: ${{ steps.keys.outputs.sim_changed }}
          CLIENT_CHANGED: ${{ steps.keys.outputs.client_changed }}
          DESKTOP_CHANGED: ${{ steps.keys.outputs.desktop_changed }}
          SIM_RUN: ${{ steps.passed.outputs.sim_run }}
          CLIENT_RUN: ${{ steps.passed.outputs.client_run }}
          DESKTOP_RUN: ${{ steps.passed.outputs.desktop_run }}
        run: |
          # runs <changed from the base> <run that passed the key>
          runs() {
            if [ "$EVENT" = workflow_dispatch ]; then echo true
            elif [ -n "$2" ]; then echo false
            elif [ "$EVENT" = pull_request ]; then echo "$1"
            else echo true
            fi
          }
          client=$(runs "$CLIENT_CHANGED" "$CLIENT_RUN")
          # Main always ships a frontend: built here, or ship-web's.
          build_client=true
          if [ "$EVENT" = pull_request ]; then build_client=$client; fi
          plan=(sim="$(runs "$SIM_CHANGED" "$SIM_RUN")" client="$client"
            desktop="$(runs "$DESKTOP_CHANGED" "$DESKTOP_RUN")" build_client="$build_client")
          echo "${plan[*]}"
          printf '%s\n' "${plan[@]}" >> "$GITHUB_OUTPUT"

  simulation-lint:
    name: Simulation lint (fmt + clippy)
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The suite is about 20 CPU-minutes, so one 4-core runner took 6 minutes
  # to run it after compiling. Each shard compiles the tests (cached deps) and
  # runs its part with cargo-nextest, which also runs every test binary at
  # once instead of one binary after another. The dispersal test (eight
  # worlds for 9000 ticks, in threads of its own) runs on a runner of its
  # own: sharing one with other tests it took four minutes, and set the
  # length of whatever shard it hashed into.
  simulation-tests:
    name: Simulation tests (${{ matrix.shard }})
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # build: what the shard compiles. The dispersal test lives in sim-core's
        # unit tests, so its shard builds only those (about half the work of
        # the workspace); `parallel` is the feature the workspace turns on.
        # cache: the incremental-compilation cache the shard restores, and
        # save: the one shard of each that saves it.
        include:
          - shard: 1/4
            build: --workspace
            run: --partition hash:1/4 -E 'not test(=sim::simulation::tests::dispersal::population_stays_dispersed_after_many_days)'
            cache: workspace
            save: true
          - shard: 2/4
            build: --workspace
            run: --partition hash:2/4 -E 'not test(=sim::simulation::tests::dispersal::population_stays_dispersed_after_many_days)'
            cache: workspace
          - shard: 3/4
            build: --workspace
            run: --partition hash:3/4 -E 'not test(=sim::simulation::tests::dispersal::population_stays_dispersed_after_many_days)'
            cache: workspace
          - shard: 4/4
            build: --workspace
            run: --partition hash:4/4 -E 'not test(=sim::simulation::tests::dispersal::population_stays_dispersed_after_many_days)'
            cache: workspace
          - shard: dispersal
            build: -p sim-core --features parallel --lib
            run: -E 'test(=sim::simulation::tests::dispersal::population_stays_dispersed_after_many_days)'
            cache: sim-core-lib
            save: true
    env:
      # Incremental compilation is turned on per step below: rust-cache sets
      # CARGO_INCREMENTAL=0 for the steps after it, over the job's env.
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v7
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      # rust-cache keeps only the dependencies; this keeps the workspace's own
      # incremental state, from this PR's last push or else from main.
      - name: Restore incremental compilation
        uses: actions/cache/restore@v6
        with:
          path: target/release/incremental
          key: incr-${{ matrix.cache }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            incr-${{ matrix.cache }}-${{ hashFiles('Cargo.lock') }}-
            incr-${{ matrix.cache }}-
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the tests
        env:
          # Incremental: a PR's next push recompiles only what changed in sim-core
          # (163k lines), about 40% less work than compiling it all again. Tests
          # run as fast from it. The perf gate keeps the full release build it measures.
          CARGO_INCREMENTAL: 1
        run: cargo nextest run --release --locked --no-run ${{ matrix.build }}
      # The tests run in the background while the cache uploads, so saving it
      # adds nothing to the shard's time.
      - name: Start the tests (shard ${{ matrix.shard }})
        env:
          CARGO_INCREMENTAL: 1
        # set +e: the step's shell runs with -e, which would end the subshell
        # on a failing test before it records the status the last step waits for.
        run: |
          (set +e
           cargo nextest run --release --locked --no-fail-fast ${{ matrix.build }} ${{ matrix.run }} > nextest.log 2>&1
           echo $? > nextest.status.tmp && mv nextest.status.tmp nextest.status) &
      - name: Save incremental compilation
        if: matrix.save
        uses: actions/cache/save@v6
        with:
          path: target/release/incremental
          key: incr-${{ matrix.cache }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
      - name: Test results (shard ${{ matrix.shard }})
        run: |
          while [ ! -f nextest.status ]; do sleep 2; done
          cat nextest.log
          exit "$(cat nextest.status)"
      # nextest does not run doc tests.
      - name: cargo test --doc
        if: matrix.shard == '1/4'
        env:
          CARGO_INCREMENTAL: 1
        run: cargo test --release --locked --workspace --doc

  # The hash of a native world's save, for the determinism job to compare with
  # the wasm of this same commit. A job of its own, so the comparison waits on
  # this minute or two and not on the simulation tests. When this run skips
  # the sim area, the run that passed it already made the same hash.
  native-fingerprint:
    name: Native save fingerprint
    needs: [changes]
    if: ${{ needs.changes.outputs.build_client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    outputs:
      fingerprint: ${{ steps.out.outputs.fingerprint }}
    steps:
      - name: The fingerprint of the run that passed the sim sources
        id: earlier
        if: needs.changes.outputs.sim == 'false' && needs.changes.outputs.sim_run != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: native-fingerprint
          run-id: ${{ needs.changes.outputs.sim_run }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v7
        if: steps.earlier.outcome != 'success'
      - uses: rui314/setup-mold@v1
        if: steps.earlier.outcome != 'success'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.earlier.outcome != 'success'
      - uses: Swatinem/rust-cache@v2
        if: steps.earlier.outcome != 'success'
        with:
          workspaces: . -> target
      - name: Build the native fingerprint
        if: steps.earlier.outcome != 'success'
        run: cargo run --release --locked -p sim-core --example save_fingerprint -- 42 3000 > native-fingerprint.txt
      - uses: actions/upload-artifact@v7
        if: steps.earlier.outcome != 'success'
        with:
          name: native-fingerprint
          path: native-fingerprint.txt
          # As long as the pass records, so a later run that skips the sim area can use it.
          retention-days: 90
      - name: Hand it to the determinism job
        id: out
        run: |
          set -euo pipefail
          cat native-fingerprint.txt
          { echo 'fingerprint<<EOF_FINGERPRINT'; cat native-fingerprint.txt; echo 'EOF_FINGERPRINT'; } >> "$GITHUB_OUTPUT"

  # Each run of the gate on a runner of its own: one run alone on a machine is
  # what keeps its timings steady (see scripts/perf-gate.sh), and the long
  # mature-world run no longer waits behind the three short ones.
  simulation-performance:
    name: Simulation performance budget (${{ matrix.runs }})
    needs: [changes]
    if: ${{ needs.changes.outputs.sim == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          # This also covers the old headless smoke test: seed 42 runs 8000 ticks.
          - runs: 3 seeds x 8000 ticks
            seeds: "42 1337 2026"
            long_ticks: 0
          - runs: seed 42 x 25000 ticks
            seeds: ""
            long_ticks: 25000
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      TICKS: 8000
      MAX_TICK_MS: 80
      MAX_RSS_MB: 256
      SEEDS: ${{ matrix.seeds }}
      LONG_TICKS: ${{ matrix.long_ticks }}
    steps:
      - uses: actions/checkout@v7
      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build headless benchmark
        # One thread, as the web build runs: the budget guards what a browser pays per tick, and a runner's
        # cores would otherwise hide a slower tick.
        run: cargo build --release --locked --bin headless --no-default-features
      - name: Enforce multi-seed tick budget
        run: scripts/perf-gate.sh

  test-frontend:
    name: Test frontend
    needs: [changes]
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: pnpm lint
        working-directory: apps/web
        run: pnpm lint

      - name: pnpm format:check
        working-directory: apps/web
        run: pnpm format:check

      - name: pnpm test
        working-directory: apps/web
        run: pnpm test

  # The single-thread and the threaded package, each on a runner of its own:
  # two fat-LTO builds on one 4-core runner slowed each other to over four
  # minutes. Each uploads `sim-core-wasm-<variant>` holding its own folder
  # under apps/web/src/wasm; consumers download `sim-core-wasm*` merged, which
  # also takes the combined `sim-core-wasm` that older runs uploaded.
  build-wasm:
    name: Build wasm sim-core (${{ matrix.variant }})
    needs: [changes]
    if: ${{ needs.changes.outputs.build_client == 'true' }}
    runs-on: ubuntu-24.04
    # A fat-LTO build (three to four minutes on a runner) plus setup; a cache hit skips it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: single
            dir: sim-core
            js: sim_core.js
            build: scripts/build-wasm.sh
          - variant: threads
            dir: sim-core-threads
            js: sim_core_threads.js
            build: scripts/build-wasm-threads.sh
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      OUT: apps/web/src/wasm/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7

      # The wasm only depends on sim-core and its locked deps, so an unchanged
      # source tree restores the previous build instead of a 5 minute compile.
      # Every release bumps the simulation-rs version in Cargo.toml and
      # Cargo.lock, which does not change the wasm, so those lines are left
      # out of the key.
      - name: Compute wasm cache key
        id: wasm-key
        run: |
          {
            find crates/sim-core -type f -not -path '*/target/*' -print0 | sort -z | xargs -0 sha256sum
            sed '/^name = "simulation-rs"$/{n;d;}' Cargo.lock
            grep -v '^version = ' apps/server/Cargo.toml
            cat Cargo.toml scripts/build-wasm.sh scripts/build-wasm-threads.sh
          } | sha256sum | cut -c1-32 > /tmp/wasm-key
          echo "key=wasm-${{ matrix.dir }}-$(cat /tmp/wasm-key)" >> "$GITHUB_OUTPUT"
      - name: Restore wasm build
        id: wasm-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.OUT }}
          key: ${{ steps.wasm-key.outputs.key }}
      # PR caches are not visible to main, so a merge that changed sim-core
      # would rebuild here. The run that passed the client area already built
      # this exact wasm; take it (the cache step then saves it for main).
      - name: Reuse the wasm of the run that passed the client area
        if: ${{ steps.wasm-cache.outputs.cache-hit != 'true' && needs.changes.outputs.client_run != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: sim-core-wasm*
          merge-multiple: true
          path: apps/web/src/wasm
          run-id: ${{ needs.changes.outputs.client_run }}
          github-token: ${{ github.token }}
      # A pattern that matches nothing downloads nothing without failing, so
      # what counts is whether this package arrived.
      - name: Is this package here?
        id: have
        run: |
          if [ -f "$OUT/${{ matrix.js }}" ]; then echo "wasm=true" >> "$GITHUB_OUTPUT"; else echo "wasm=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.have.outputs.wasm != 'true'
        with:
          targets: wasm32-unknown-unknown
      # The threaded build rebuilds std with atomics, so it needs this nightly (see scripts/build-wasm-threads.sh).
      # Pinned to a full commit (master at the time of writing), not a branch.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: steps.have.outputs.wasm != 'true' && matrix.variant == 'threads'
        with:
          toolchain: nightly-2025-11-15
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        if: steps.have.outputs.wasm != 'true'
        with:
          workspaces: . -> target
          key: ${{ matrix.variant }}
      - name: Install wasm-pack
        if: steps.have.outputs.wasm != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build wasm sim-core (${{ matrix.variant }})
        if: steps.have.outputs.wasm != 'true'
        run: ${{ matrix.build }}
      # Only this package's folder: the other one may have come with a reused artifact.
      - name: Keep only this package
        run: find apps/web/src/wasm -mindepth 1 -maxdepth 1 ! -name '${{ matrix.dir }}' -exec rm -rf {} +
      - uses: actions/upload-artifact@v7
        with:
          name: sim-core-wasm-${{ matrix.variant }}
          path: apps/web/src/wasm
          retention-days: 7

  # The browser sim must make the same world as the native one. Both sides come
  # from this commit's sources, so changing the world's rules needs no committed
  # value updated. Runs for every wasm built or reused, so a client pass always
  # covers one. The native hash comes from native-fingerprint.
  determinism:
    name: Native and wasm worlds match
    needs: [changes, native-fingerprint, build-wasm]
    if: >-
      ${{ !cancelled()
        && needs.build-wasm.result == 'success'
        && needs.native-fingerprint.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8
        with:
          pattern: sim-core-wasm*
          merge-multiple: true
          path: apps/web/src/wasm
      - name: Compare the wasm world with the native one
        env:
          NATIVE: ${{ needs.native-fingerprint.outputs.fingerprint }}
        run: |
          [[ "$NATIVE" =~ ^0x[0-9a-f]{16}$ ]] || { echo "no native fingerprint ('$NATIVE')" >&2; exit 1; }
          node scripts/check-wasm-determinism.mjs apps/web/src/wasm/sim-core --native "$NATIVE"

  build-frontend:
    name: Build frontend
    needs: [changes, test-frontend, build-wasm]
    # When the run that passed the client area has a production bundle, main
    # ships that instead (ship-web).
    if: >-
      ${{ !cancelled()
        && needs.changes.outputs.build_client == 'true'
        && needs.changes.outputs.bundle != 'true'
        && needs.build-wasm.result == 'success'
        && (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HAS_ANALYTICS_KEY: ${{ secrets.VITE_POSTHOG_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Download wasm sim-core
        uses: actions/download-artifact@v8
        with:
          pattern: sim-core-wasm*
          merge-multiple: true
          path: apps/web/src/wasm

      - name: pnpm run build
        working-directory: apps/web
        run: pnpm run build
        env:
          VITE_GIT_SHA:      ${{ github.sha }}
          VITE_BUILD_TS:     ${{ steps.ts.outputs.build_ts }}
          # PostHog analytics. The key comes from repo secrets so it never lands in the repo. Build-time injection
          # means the bundle only includes it on prod CI builds — local `pnpm dev` reads the developer's own .env
          # (or simply doesn't initialize, see analytics.ts). The host is not set here: the website sends through
          # its own /ingest proxy (functions/ingest), see shared/analytics-host.ts.
          VITE_POSTHOG_KEY:  ${{ secrets.VITE_POSTHOG_KEY }}

      # A PR bundle without the analytics key (Dependabot PRs get no secrets)
      # is not the production bundle, so main rebuilds instead of shipping it.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' || env.HAS_ANALYTICS_KEY == 'true'
        with:
          name: client-dist
          path: apps/web/dist
          retention-days: 7

  test-desktop:
    name: Typecheck desktop
    needs: [changes]
    if: ${{ needs.changes.outputs.desktop == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: apps/desktop
        run: pnpm exec tsc -p tsconfig.json --noEmit
      - name: desktop main-process tests
        working-directory: apps/desktop
        run: pnpm run test:main

  bump-version:
    name: Bump version
    # Only runs for direct pushes to main (post-merge). PRs go through
    # the test jobs only — no version bump, no deploy. The gate's own needs
    # include jobs that skip by design (an area's suites once an earlier run
    # passed its inputs, ship-web or build-frontend), and a skipped ancestor
    # fails the default success() check, so this and the jobs after it check
    # their needs explicitly.
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    outputs:
      new: ${{ steps.bump.outputs.new }}
    steps:
      # The tip of main, not this run's commit: a merge that landed before the
      # previous run's bump would otherwise recompute the same version.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - name: Compute + apply patch bump
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version = ' apps/server/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          # Rollover scheme: patch increments to 99, then jumps to next
          # minor with patch reset to 0. e.g. 0.0.99 -> 0.1.0, 0.1.99 -> 0.2.0.
          # Minor rolls over the same way: 0.99.99 -> 1.0.0.
          NEW_PATCH=$((PATCH + 1))
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR
          if [ "$NEW_PATCH" -gt 99 ]; then
            NEW_PATCH=0
            NEW_MINOR=$((MINOR + 1))
            if [ "$NEW_MINOR" -gt 99 ]; then
              NEW_MINOR=0
              NEW_MAJOR=$((MAJOR + 1))
            fi
          fi
          NEW="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "Bumping $CURRENT -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          sed -i -E "0,/^version = \"[^\"]+\"$/s//version = \"$NEW\"/" apps/server/Cargo.toml

          awk -v new="$NEW" '
            /^name = "simulation-rs"$/ { hit = 1; print; next }
            hit && /^version = / { sub(/"[^"]+"/, "\"" new "\""); hit = 0 }
            { print }
          ' Cargo.lock > Cargo.lock.tmp
          mv Cargo.lock.tmp Cargo.lock

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' apps/web/package.json > "$tmp" && mv "$tmp" apps/web/package.json

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' apps/desktop/package.json > "$tmp" && mv "$tmp" apps/desktop/package.json

      - name: Commit + push as bump bot
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name  "thb-bumpbot"
          git config user.email "bumpbot@thehumanbox.com"
          git add apps/server/Cargo.toml Cargo.lock apps/web/package.json apps/desktop/package.json
          # [skip ci]: a run for this commit would do nothing, and while
          # queued it would replace (cancel) a merge's pending run.
          git commit -m "chore: release $NEW [skip-bump] [skip ci]"
          git pull --rebase origin main
          git push

  release-gate:
    name: Release gate (all checks completed)
    # always() so the gate decides from the results itself. Each area's
    # suites must pass here, or skip because an earlier run passed the same
    # inputs; the wasm and a shipped frontend are always needed.
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip-bump]') }}
    needs: [changes, simulation-lint, simulation-tests, simulation-performance, test-frontend, build-wasm, determinism, build-frontend, test-desktop, ship-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm release prerequisites
        env:
          CHANGES: ${{ needs.changes.result }}
          SIM_RUN: ${{ needs.changes.outputs.sim_run }}
          CLIENT_RUN: ${{ needs.changes.outputs.client_run }}
          DESKTOP_RUN: ${{ needs.changes.outputs.desktop_run }}
          LINT: ${{ needs.simulation-lint.result }}
          TESTS: ${{ needs.simulation-tests.result }}
          PERF: ${{ needs.simulation-performance.result }}
          FRONTEND_TESTS: ${{ needs.test-frontend.result }}
          DESKTOP_TESTS: ${{ needs.test-desktop.result }}
          WASM: ${{ needs.build-wasm.result }}
          DETERMINISM: ${{ needs.determinism.result }}
          FRONTEND: ${{ needs.build-frontend.result }}
          SHIPPED: ${{ needs.ship-web.result }}
        run: |
          echo "changes=$CHANGES lint=$LINT tests=$TESTS perf=$PERF frontend-tests=$FRONTEND_TESTS desktop-tests=$DESKTOP_TESTS"
          echo "wasm=$WASM frontend=$FRONTEND shipped=$SHIPPED; passed earlier in: sim ${SIM_RUN:-none}, client ${CLIENT_RUN:-none}, desktop ${DESKTOP_RUN:-none}"
          fail() { echo "$1" >&2; exit 1; }
          # area <run that passed it earlier> <job results...>
          area() {
            local passed=$1 result
            shift
            for result in "$@"; do
              [ "$result" = success ] && continue
              [ "$result" = skipped ] && [ -n "$passed" ] && continue
              fail "a required check did not succeed ($result)"
            done
          }
          [ "$CHANGES" = success ] || fail "change detection did not succeed ($CHANGES)"
          [ "$WASM" = success ] || fail "the wasm build did not succeed ($WASM)"
          [ "$DETERMINISM" = success ] || fail "the wasm world was not shown to match the native one ($DETERMINISM)"
          [ "$FRONTEND" = success ] || [ "$SHIPPED" = success ] || fail "no frontend was built or shipped"
          area "$SIM_RUN" "$LINT" "$TESTS" "$PERF"
          area "$CLIENT_RUN" "$FRONTEND_TESTS"
          area "$DESKTOP_RUN" "$DESKTOP_TESTS"
          echo "All test, wasm, frontend, and desktop checks completed successfully."

  publish-release:
    name: Publish desktop release
    needs: [bump-version]
    if: ${{ !cancelled() && needs.bump-version.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Create release for desktop installers (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW:      ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          if gh release view "v$NEW" >/dev/null 2>&1; then
            echo "Release v$NEW already exists"
          else
            echo "Creating release v$NEW"
            gh release create "v$NEW" \
              --title "v$NEW" \
              --notes "Automated desktop release. Native installers run the simulation locally; SHA ${GITHUB_SHA}." \
              --target main
          fi
      # The installers take minutes; as their own run they no longer keep this
      # run (and with it the next merge's run) waiting. They build this run's
      # commit and reuse its wasm.
      - name: Start the desktop installer builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW:      ${{ needs.bump-version.outputs.new }}
        run: |
          gh workflow run desktop-release.yml --ref main \
            -f tag="v$NEW" -f version="$NEW" \
            -f source_sha="$GITHUB_SHA" -f pipeline_run_id="$GITHUB_RUN_ID"

  # When the run that passed the client area built the production bundle,
  # main deploys that bundle straight away, before any other job: the merge
  # is live about a minute after it lands. Only the commit stamp changes (a
  # PR build is stamped with the PR's merge commit, a main build with its
  # own commit).
  ship-web:
    name: Deploy frontend (bundle that passed)
    needs: [changes]
    if: ${{ needs.changes.outputs.bundle == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents:    read
      actions:     read
      deployments: write
    steps:
      # The artifact is only the static build; the Pages Functions (the /ingest analytics proxy) live in the
      # source and must sit next to dist for wrangler to upload them. Without them every /ingest request got
      # the static site's 405 and no website analytics arrived (#909).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/web/functions
          sparse-checkout-cone-mode: false
      - name: Download the static frontend that passed
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: apps/web/dist
          run-id: ${{ needs.changes.outputs.client_run }}
          github-token: ${{ github.token }}

      # useVersionCheck only prompts open tabs to reload when version.json's
      # built_at is newer than their own build, and bundles can ship in a
      # different order than they were built, so built_at becomes the deploy
      # time. The bundle keeps its build time (the About modal shows it).
      - name: Stamp this commit
        working-directory: apps/web/dist
        run: |
          set -euo pipefail
          built=$(jq -r .sha version.json)
          [[ "$built" =~ ^[0-9a-f]{40}$ ]] || { echo "unexpected build sha '$built'" >&2; exit 1; }
          grep -rlF "$built" . | xargs -r sed -i "s/$built/$GITHUB_SHA/g"
          if grep -rqF "$built" .; then echo "the build sha is still in the bundle" >&2; exit 1; fi
          jq -c --argjson now "$(date -u +%s)" '.built_at = $now' version.json > version.json.tmp
          mv version.json.tmp version.json
          echo "stamped $built -> $(cat version.json)"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=thehumanbox --branch=main

      # The function, not the static site, must answer /ingest: the preflight PostHog sends gets a 2xx, and
      # a made-up path the function's own 404 (the static site answers both with 405).
      - name: Check the analytics proxy is live
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -uo pipefail
          # The deployment this job just made, never the live site: that could be an older healthy one.
          if [[ -z "$URL" ]]; then
            echo "Cloudflare did not return the deployment's URL" >&2
            exit 1
          fi
          status() { curl -s -o /dev/null --max-time 10 -w '%{http_code}' -X "$1" "$URL$2" || echo 000; }
          # Both capture paths must reach PostHog. A body without a distinct_id is refused there with a 4xx that
          # is not 404, so a 404 means the function itself turned the path away: #919, where every capture
          # went to /i/v0/e/ while this check only tried /e/.
          capture() {
            curl -s -o /dev/null --max-time 10 -w '%{http_code}' -X POST -H 'content-type: application/json' \
              -d '{"api_key":"deploy-check","event":"deploy-check"}' "$URL$1" || echo 000
          }
          for i in 1 2 3 4 5 6; do
            pre=$(status OPTIONS /ingest/e/)
            miss=$(status POST /ingest/not-a-posthog-path)
            e=$(capture /ingest/e/)
            v0=$(capture /ingest/i/v0/e/)
            summary="OPTIONS /ingest/e/ $pre, unknown path $miss, capture /e/ $e, capture /i/v0/e/ $v0"
            if [[ "$pre" == 2?? && "$miss" == 404 && "$e" != 404 && "$e" != 000 && "$v0" != 404 && "$v0" != 000 ]]; then
              echo "proxy live at $URL: $summary"
              exit 0
            fi
            echo "attempt $i: $summary"
            sleep 10
          done
          echo "the /ingest function is not live at $URL (want a 2xx preflight, a 404 for an unknown path, and both capture paths forwarded)" >&2
          exit 1

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    # The frontend ships once the gate passes; the version bump is not part
    # of the bundle, so it does not wait for it.
    needs: [release-gate, build-frontend]
    if: ${{ !cancelled() && needs.release-gate.result == 'success' && needs.build-frontend.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents:    read
      deployments: write
    steps:
      # The artifact is only the static build; the Pages Functions (the /ingest analytics proxy) live in the
      # source and must sit next to dist for wrangler to upload them. Without them every /ingest request got
      # the static site's 405 and no website analytics arrived (#909).
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/web/functions
          sparse-checkout-cone-mode: false
      - name: Download static frontend
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          path: apps/web/dist

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy dist --project-name=thehumanbox --branch=main

      # The function, not the static site, must answer /ingest: the preflight PostHog sends gets a 2xx, and
      # a made-up path the function's own 404 (the static site answers both with 405).
      - name: Check the analytics proxy is live
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -uo pipefail
          # The deployment this job just made, never the live site: that could be an older healthy one.
          if [[ -z "$URL" ]]; then
            echo "Cloudflare did not return the deployment's URL" >&2
            exit 1
          fi
          status() { curl -s -o /dev/null --max-time 10 -w '%{http_code}' -X "$1" "$URL$2" || echo 000; }
          # Both capture paths must reach PostHog. A body without a distinct_id is refused there with a 4xx that
          # is not 404, so a 404 means the function itself turned the path away: #919, where every capture
          # went to /i/v0/e/ while this check only tried /e/.
          capture() {
            curl -s -o /dev/null --max-time 10 -w '%{http_code}' -X POST -H 'content-type: application/json' \
              -d '{"api_key":"deploy-check","event":"deploy-check"}' "$URL$1" || echo 000
          }
          for i in 1 2 3 4 5 6; do
            pre=$(status OPTIONS /ingest/e/)
            miss=$(status POST /ingest/not-a-posthog-path)
            e=$(capture /ingest/e/)
            v0=$(capture /ingest/i/v0/e/)
            summary="OPTIONS /ingest/e/ $pre, unknown path $miss, capture /e/ $e, capture /i/v0/e/ $v0"
            if [[ "$pre" == 2?? && "$miss" == 404 && "$e" != 404 && "$e" != 000 && "$v0" != 404 && "$v0" != 000 ]]; then
              echo "proxy live at $URL: $summary"
              exit 0
            fi
            echo "attempt $i: $summary"
            sleep 10
          done
          echo "the /ingest function is not live at $URL (want a 2xx preflight, a 404 for an unknown path, and both capture paths forwarded)" >&2
          exit 1

  # Leaves `pass-<area>-<key>` for each area whose suites all ran and passed
  # here; a later run with the same key skips them (see changes). The record
  # is a few bytes, kept long enough that an area nobody touches for weeks
  # still counts as passed.
  record-passes:
    name: Record the areas that passed
    if: ${{ always() && needs.changes.result == 'success' }}
    needs: [changes, simulation-lint, simulation-tests, simulation-performance, test-frontend, build-wasm, determinism, build-frontend, test-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Write the record
        run: printf 'run %s\nsha %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > passed.txt
      - name: Record sim
        if: >-
          ${{ needs.changes.outputs.sim == 'true' && needs.simulation-lint.result == 'success'
            && needs.simulation-tests.result == 'success' && needs.simulation-performance.result == 'success'
            && (needs.determinism.result == 'success' || needs.determinism.result == 'skipped') }}
        uses: actions/upload-artifact@v7
        with:
          name: pass-sim-${{ needs.changes.outputs.sim_key }}
          path: passed.txt
          retention-days: 90
      - name: Record client
        if: >-
          ${{ needs.changes.outputs.client == 'true' && needs.test-frontend.result == 'success'
            && needs.build-wasm.result == 'success' && needs.build-frontend.result == 'success'
            && needs.determinism.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: pass-client-${{ needs.changes.outputs.client_key }}
          path: passed.txt
          retention-days: 90
      - name: Record desktop
        if: ${{ needs.changes.outputs.desktop == 'true' && needs.test-desktop.result == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: pass-desktop-${{ needs.changes.outputs.desktop_key }}
          path: passed.txt
          retention-days: 90
