name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# PR runs are cancellable so that pushing new commits to a PR
# supersedes the prior run. Main runs serialize (bump-version /
# build / deploy chain must run in order without losing one).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Test backend
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
      - name: cargo fmt --check
        working-directory: simulation
        run: cargo fmt --all -- --check
        continue-on-error: true # ratchet — flip to hard-fail once
                                # the existing tree is formatted.
      - name: cargo clippy
        working-directory: simulation
        run: cargo clippy --all-targets --locked -- -W clippy::all
        continue-on-error: true # ratchet — see fmt note above.
      - name: cargo test --release --locked --workspace
        working-directory: simulation
        # --workspace so the sim-core crate's tests run too (the bulk of the
        # suite lives there after the core was split out for the wasm build).
        run: cargo test --release --locked --workspace
      - name: headless smoke (6000 ticks, fixed seed)
        working-directory: simulation
        run: |
          cargo build --release --locked --bin headless
          ./target/release/headless --seed 42 --ticks 6000 --every 6000
        timeout-minutes: 4

  test-frontend:
    name: Test + build frontend
    if: ${{ !contains(github.event.head_commit.message, '[skip-bump]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: pnpm install
        working-directory: client
        run: pnpm install --frozen-lockfile

      - id: ts
        run: echo "build_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: pnpm lint
        working-directory: client
        run: pnpm lint
        continue-on-error: true # ratchet — flip once existing lint
                                # debt is paid down.

      - name: pnpm format:check
        working-directory: client
        run: pnpm format:check
        continue-on-error: true # ratchet — same.

      - name: pnpm test
        working-directory: client
        run: pnpm test

      - name: pnpm run build
        working-directory: client
        run: pnpm run build
        env:
          VITE_API_BASE:     ${{ secrets.VITE_API_BASE }}
          VITE_GIT_SHA:      ${{ github.sha }}
          VITE_BUILD_TS:     ${{ steps.ts.outputs.build_ts }}
          # Public URL of the dynamic OG endpoint exposed by the
          # simulation server. Defaults to the public production URL
          # if the repo secret isn't set yet.
          # Point at the same-origin proxy (client/functions/og.png.ts)
          # rather than the cross-origin API URL — SEO validators
          # flag cross-host og:image as "invalid/unreachable" even
          # when it loads fine on real social crawlers.
          VITE_OG_IMAGE_URL: ${{ secrets.VITE_OG_IMAGE_URL || 'https://thehumanbox.com/og.png' }}
          # PostHog analytics. Token + host pulled from repo secrets so
          # the key never lands in the repo. Build-time injection means
          # the bundle only includes them on prod CI builds — local
          # `pnpm dev` reads the developer's own .env (or simply doesn't
          # initialize, see analytics.ts).
          VITE_POSTHOG_KEY:  ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          # Include both the static build and the Pages Functions
          # directory so the deploy job can hand both to wrangler.
          # Cloudflare Pages picks up `functions/` next to the
          # deploy directory and bundles each route automatically.
          path: |
            client/dist
            client/functions
          retention-days: 7

  bump-version:
    name: Bump version
    # Only runs for direct pushes to main (post-merge). PRs go through
    # the test jobs only — no version bump, no deploy.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    outputs:
      new: ${{ steps.bump.outputs.new }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BUMP_PAT }}

      - name: Compute + apply patch bump
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version = ' simulation/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          # Rollover scheme: patch increments to 99, then jumps to next
          # minor with patch reset to 0. e.g. 0.0.99 -> 0.1.0, 0.1.99 -> 0.2.0.
          # Minor rolls over the same way: 0.99.99 -> 1.0.0.
          NEW_PATCH=$((PATCH + 1))
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR
          if [ "$NEW_PATCH" -gt 99 ]; then
            NEW_PATCH=0
            NEW_MINOR=$((MINOR + 1))
            if [ "$NEW_MINOR" -gt 99 ]; then
              NEW_MINOR=0
              NEW_MAJOR=$((MAJOR + 1))
            fi
          fi
          NEW="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          echo "Bumping $CURRENT -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          sed -i -E "0,/^version = \"[^\"]+\"$/s//version = \"$NEW\"/" simulation/Cargo.toml

          awk -v new="$NEW" '
            /^name = "simulation-rs"$/ { hit = 1; print; next }
            hit && /^version = / { sub(/"[^"]+"/, "\"" new "\""); hit = 0 }
            { print }
          ' simulation/Cargo.lock > simulation/Cargo.lock.tmp
          mv simulation/Cargo.lock.tmp simulation/Cargo.lock

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' client/package.json > "$tmp" && mv "$tmp" client/package.json

          tmp=$(mktemp)
          jq --arg v "$NEW" '.version = $v' desktop/package.json > "$tmp" && mv "$tmp" desktop/package.json

      - name: Commit + push as bump bot
        env:
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name  "thb-bumpbot"
          git config user.email "bumpbot@thehumanbox.com"
          git add simulation/Cargo.toml simulation/Cargo.lock client/package.json desktop/package.json
          git commit -m "chore: release $NEW [skip-bump]"
          git pull --rebase origin main
          git push

  build-backend-binary:
    name: Build backend binary (aarch64, at bumped commit)
    needs: [bump-version]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Install mold linker
        run: sudo apt-get install -y mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target
          key: aarch64-release
      - name: Verify version matches expected
        env:
          NEW: ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          ACTUAL=$(grep '^version = ' simulation/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$ACTUAL" != "$NEW" ]]; then
            echo "Cargo.toml says version=$ACTUAL but expected $NEW - did the bump push not land?" >&2
            exit 1
          fi
          echo "OK: building binary with embedded version $ACTUAL"
      - name: cargo build --release --bin simulation-rs
        working-directory: simulation
        run: cargo build --release --locked --bin simulation-rs
      - name: Strip binary
        run: |
          strip simulation/target/release/simulation-rs
          ls -lh simulation/target/release/simulation-rs
      - uses: actions/upload-artifact@v7
        with:
          name: simulation-rs-aarch64
          path: simulation/target/release/simulation-rs
          retention-days: 14

  publish-release:
    name: Publish release with aarch64 binary
    needs: [bump-version, build-backend-binary]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: simulation-rs-aarch64
          path: ./bin
      - name: Make binary executable
        run: chmod +x ./bin/simulation-rs
      - name: Create release + attach binary (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW:      ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          if gh release view "v$NEW" >/dev/null 2>&1; then
            echo "Release v$NEW already exists - replacing binary"
            gh release upload "v$NEW" ./bin/simulation-rs --clobber
          else
            echo "Creating release v$NEW"
            gh release create "v$NEW" \
              --title "v$NEW" \
              --notes "Automated release. Backend binary built on ubuntu-24.04-arm runner; SHA ${GITHUB_SHA}." \
              --target main \
              ./bin/simulation-rs
          fi

  build-desktop:
    name: Build desktop installers + attach to release
    needs: [bump-version, publish-release]
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag:     v${{ needs.bump-version.outputs.new }}
      version: ${{ needs.bump-version.outputs.new }}

  deploy-backend:
    name: Deploy backend (SSM, no on-box compile)
    needs: [bump-version, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pipeline-deploy-main
      cancel-in-progress: false
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM deploy command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          NEW_VERSION: ${{ needs.bump-version.outputs.new }}
        run: |
          set -euo pipefail
          DEPLOY_CMD="cd /root/thehumanbox && git pull --ff-only && chmod +x scripts/update.sh && scripts/update.sh ${NEW_VERSION}"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy v$NEW_VERSION (gh-release binary)" \
            --parameters "commands=[\"$DEPLOY_CMD\"]" \
            --output text --query 'Command.CommandId')
          echo "SSM command dispatched: $CMD_ID"
          echo "Track: https://${{ vars.AWS_REGION }}.console.aws.amazon.com/systems-manager/run-command/$CMD_ID"

  deploy-frontend:
    name: Deploy frontend (Cloudflare Pages)
    needs: bump-version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents:    read
      deployments: write
    steps:
      - name: Download dist/ + functions/ from test-frontend
        uses: actions/download-artifact@v8
        with:
          name: client-dist
          # Multi-path upload's common-ancestor strips the `client/`
          # prefix, so the artifact contains `dist/` and `functions/`
          # at its root. Restore them under `client/` so the layout
          # mirrors the source tree.
          path: client

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from client/ so wrangler discovers ./functions next
          # to the deploy target. Without the workingDirectory wrangler
          # would look for functions/ at the repo root and miss them.
          workingDirectory: client
          command: pages deploy dist --project-name=thehumanbox --branch=main
