name: desktop-release

# Builds the Electron desktop app for macOS (arm64+x64), Windows (x64),
# and Linux (x64), and uploads each artifact to the GitHub Release that
# triggered the run. Triggered:
#
#   - automatically when a release is published (the main pipeline bumps
#     the version + cuts a tag, then this fires)
#   - manually via workflow_dispatch (pass a tag name, useful for re-running
#     a failed platform build without re-cutting the release)

on:
  # Called from pipeline.yml after publish-release creates the tag. The
  # `release: published` event doesn't fire reliably when the release is
  # created by the default GITHUB_TOKEN, so we chain explicitly instead.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v0.2.1)'
        required: true
        type: string
      version:
        description: 'Numeric version to stamp into desktop/package.json (e.g. 0.2.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (e.g. v0.2.1)'
        required: true
      version:
        description: 'Numeric version to stamp into desktop/package.json (e.g. 0.2.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-14
            sim_target: aarch64-apple-darwin
            bin_name: simulation-rs
          - label: Linux-x64
            os: ubuntu-24.04
            sim_target: x86_64-unknown-linux-gnu
            bin_name: simulation-rs
          - label: Windows-x64
            os: windows-2022
            sim_target: x86_64-pc-windows-msvc
            bin_name: simulation-rs.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      # The triggering SHA is the user's push, not the bump-bot's commit
      # that updated desktop/package.json's version. Stamp the version in
      # explicitly so electron-builder names artifacts + publishes to the
      # right release tag.
      - name: Stamp desktop version
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          jq --arg v "${{ inputs.version }}" '.version = $v' desktop/package.json > "$tmp"
          mv "$tmp" desktop/package.json
          echo "desktop/package.json version → $(jq -r .version desktop/package.json)"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.sim_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation
          key: ${{ matrix.sim_target }}

      - name: Build simulation binary
        shell: bash
        working-directory: simulation
        run: cargo build --release --locked --bin simulation-rs --target ${{ matrix.sim_target }}

      - name: Stage simulation binary into desktop/resources/bin/
        shell: bash
        run: |
          mkdir -p desktop/resources/bin
          cp simulation/target/${{ matrix.sim_target }}/release/${{ matrix.bin_name }} desktop/resources/bin/

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm sim-core (renderer imports it)
        shell: bash
        working-directory: simulation
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: wasm-pack build sim-core --target web --release --out-dir ../../client/src/wasm/sim-core

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - name: Install client deps
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: client
        run: pnpm run build
        env:
          VITE_API_BASE:     ${{ secrets.VITE_API_BASE }}
          VITE_GIT_SHA:      ${{ github.sha }}
          VITE_OG_IMAGE_URL: ${{ secrets.VITE_OG_IMAGE_URL || 'https://thehumanbox.com/og.png' }}
          VITE_POSTHOG_KEY:  ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build + package desktop
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
          # Code signing intentionally disabled for now — see desktop/README.md
          # for the bypass instructions users get on first launch. When we
          # have certs, wire CSC_LINK / CSC_KEY_PASSWORD / WIN_CSC_LINK /
          # WIN_CSC_KEY_PASSWORD via repo secrets and flip the flags in
          # electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run release

      - name: Upload artifact (debug, if release upload fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}-out
          path: desktop/out
          retention-days: 7
