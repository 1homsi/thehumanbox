name: desktop-release

# Builds the Electron desktop app for macOS (arm64), Windows (x64) and
# Linux (x64), and uploads each artifact to a GitHub Release. Started:
#
#   - by pipeline.yml's publish-release once it cuts the release, as its own
#     run so the installers never hold up the next merge's pipeline (the
#     `release: published` event does not fire for a release made with the
#     default GITHUB_TOKEN, but a workflow_dispatch does)
#   - manually (pass a tag name, useful for re-running a failed platform
#     build without re-cutting the release)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (e.g. v0.2.1)'
        required: true
      version:
        description: 'Numeric version to stamp into apps/desktop/package.json (e.g. 0.2.1)'
        required: true
      source_sha:
        description: 'Commit to build (defaults to the branch the run starts on)'
        required: false
        default: ''
      pipeline_run_id:
        description: 'Pipeline run whose sim-core-wasm artifact to reuse (built here when empty)'
        required: false
        default: ''

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-14
            sim_target: aarch64-apple-darwin
            bin_name: simulation-rs
          - label: Linux-x64
            os: ubuntu-24.04
            sim_target: x86_64-unknown-linux-gnu
            bin_name: simulation-rs
          - label: Windows-x64
            os: windows-2022
            sim_target: x86_64-pc-windows-msvc
            bin_name: simulation-rs.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      # The triggering SHA is the user's push, not the bump-bot's commit
      # that updated apps/desktop/package.json's version. Stamp the version in
      # explicitly so electron-builder names artifacts + publishes to the
      # right release tag.
      - name: Stamp desktop version
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          jq --arg v "${{ inputs.version }}" '.version = $v' apps/desktop/package.json > "$tmp"
          mv "$tmp" apps/desktop/package.json
          echo "apps/desktop/package.json version → $(jq -r .version apps/desktop/package.json)"

      # Most releases leave the simulation alone, and compiling it was the
      # slowest step (about 2.5 minutes on Windows). Key the binary on its
      # sources (scripts/source-key.sh ignores the release version stamps).
      - name: Simulation binary key
        id: sim-key
        shell: bash
        run: echo "key=sim-bin-${{ matrix.sim_target }}-$(scripts/source-key.sh crates apps/server Cargo.toml Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Restore simulation binary
        id: sim-bin
        uses: actions/cache@v6
        with:
          path: target/${{ matrix.sim_target }}/release/${{ matrix.bin_name }}
          key: ${{ steps.sim-key.outputs.key }}

      # The wasm is platform independent and the pipeline already built it;
      # rebuilding it here cost 5 to 9 minutes per OS. A manual dispatch has
      # no pipeline run, so it falls back to building.
      - name: Reuse wasm sim-core from the pipeline
        id: wasm
        if: ${{ inputs.pipeline_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: sim-core-wasm
          path: apps/web/src/wasm/sim-core
          run-id: ${{ inputs.pipeline_run_id }}
          github-token: ${{ github.token }}

      - name: Setup Rust toolchain
        if: steps.sim-bin.outputs.cache-hit != 'true' || steps.wasm.outcome != 'success'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.sim_target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.sim-bin.outputs.cache-hit != 'true'
        with:
          workspaces: .
          key: ${{ matrix.sim_target }}

      - name: Build simulation binary
        if: steps.sim-bin.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --release --locked --bin simulation-rs --target ${{ matrix.sim_target }}

      - name: Stage simulation binary into apps/desktop/resources/bin/
        shell: bash
        run: |
          mkdir -p apps/desktop/resources/bin
          cp target/${{ matrix.sim_target }}/release/${{ matrix.bin_name }} apps/desktop/resources/bin/

      - name: Install wasm-pack
        if: steps.wasm.outcome != 'success'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm sim-core (renderer imports it)
        if: steps.wasm.outcome != 'success'
        shell: bash
        run: scripts/build-wasm.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install client deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # electron-builder zips at 7-Zip level 7, three Deflate passes; on Windows
      # the zip took 54 of the job's 300 seconds. Level 5 is one pass, and it
      # also packs the NSIS installer's payload a little faster. The macOS zip
      # is the auto-update download, so it keeps the smaller default.
      - name: Faster archive compression on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "ELECTRON_BUILDER_COMPRESSION_LEVEL=5" >> "$GITHUB_ENV"

      - name: Build + package desktop
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
          # Code signing intentionally disabled for now — see apps/desktop/README.md
          # for the bypass instructions users get on first launch. When we
          # have certs, wire CSC_LINK / CSC_KEY_PASSWORD / WIN_CSC_LINK /
          # WIN_CSC_KEY_PASSWORD via repo secrets and flip the flags in
          # electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # `pnpm run release` builds the renderer (the client with
          # VITE_DESKTOP=1) itself, so the client is built once, here.
          VITE_GIT_SHA:      ${{ inputs.source_sha || github.sha }}
          VITE_POSTHOG_KEY:  ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}
        run: pnpm run release

      - name: Upload artifact (debug, if release upload fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}-out
          path: apps/desktop/out
          retention-days: 7
