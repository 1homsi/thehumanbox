# Temporary: which macOS runner images still get a machine. Removed before merge.
name: macos-probe
on:
  pull_request:
    paths: [.github/workflows/macos-probe.yml]
jobs:
  probe:
    name: probe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: sw_vers && uname -m && xcodebuild -version | head -1
