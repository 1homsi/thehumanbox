name: Deploy simulation to EC2

on:
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - '.github/workflows/deploy-simulation.yml'
  workflow_dispatch:

concurrency:
  group: deploy-simulation
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target

      - name: cargo build --release
        working-directory: simulation
        run: cargo build --release --locked

      - name: cargo test
        working-directory: simulation
        run: cargo test --locked

  deploy:
    name: SSM rebuild + restart on EC2
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM deploy command
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          DEPLOY_CMD='cd /root/thehumanbox && git pull --ff-only && /root/.cargo/bin/cargo build --release --manifest-path simulation/Cargo.toml && systemctl restart simulation'
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"$DEPLOY_CMD\"]" \
            --output text --query 'Command.CommandId')
          echo "Command id: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command + stream output
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          CMD_ID:      ${{ steps.send.outputs.cmd_id }}
        run: |
          set -euo pipefail

          # Tail SSM's StandardOutputContent / StandardErrorContent live.
          # SSM updates these fields while the command is in flight (capped at
          # 24 KB each), so we poll, print only the new bytes since last poll,
          # and exit on a terminal status.
          last_out_len=0
          last_err_len=0
          last_status=""

          # ~30 minutes of headroom (240 * 8 s). cargo build --release on the
          # c7g cold takes ~10 min; warm takes ~30 s.
          for _ in $(seq 1 240); do
            JSON=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || echo '{}')

            STATUS=$(echo "$JSON" | jq -r '.Status        // "Pending"')
            OUT=$(   echo "$JSON" | jq -r '.StandardOutputContent // ""')
            ERR=$(   echo "$JSON" | jq -r '.StandardErrorContent  // ""')

            # Print new stdout chunk (if any).
            cur_out_len=${#OUT}
            if [ "$cur_out_len" -gt "$last_out_len" ]; then
              printf '%s' "${OUT:$last_out_len}"
              last_out_len=$cur_out_len
            fi
            # Print new stderr chunk (cargo emits "Compiling ..." on stderr).
            cur_err_len=${#ERR}
            if [ "$cur_err_len" -gt "$last_err_len" ]; then
              printf '%s' "${ERR:$last_err_len}" >&2
              last_err_len=$cur_err_len
            fi

            # Show status changes only — avoids "Pending - waiting" spam.
            if [ "$STATUS" != "$last_status" ]; then
              echo "::group::SSM status: $STATUS"
              echo "::endgroup::"
              last_status=$STATUS
            fi

            case "$STATUS" in
              Success)
                echo "::notice::SSM deploy succeeded"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                echo "::error::SSM deploy finished with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 8
                ;;
            esac
          done

          echo "::error::Timed out after 30 minutes waiting for SSM command"
          exit 1
