name: Deploy simulation to EC2

on:
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - '.github/workflows/deploy-simulation.yml'
  workflow_dispatch:

concurrency:
  group: deploy-simulation
  cancel-in-progress: false

jobs:
  build:
    name: Build & test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target

      - name: cargo build --release
        working-directory: simulation
        run: cargo build --release --locked

      - name: cargo test
        working-directory: simulation
        run: cargo test --locked

  deploy:
    name: SSM fire-and-forget on EC2
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM deploy command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          DEPLOY_CMD='cd /root/thehumanbox && git pull --ff-only && /root/.cargo/bin/cargo build --release --manifest-path simulation/Cargo.toml && systemctl restart simulation'
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"$DEPLOY_CMD\"]" \
            --output text --query 'Command.CommandId')
          echo "SSM command dispatched: $CMD_ID"
          echo "Track at: https://eu-west-1.console.aws.amazon.com/systems-manager/run-command/$CMD_ID"
