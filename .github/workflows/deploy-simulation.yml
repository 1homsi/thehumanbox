name: Deploy simulation to EC2

# Two-stage deploy:
#   1. Build & test the Rust crate on the GitHub runner. If anything fails
#      to compile (or a test breaks), we never touch the EC2 box.
#   2. Trigger the actual rebuild on the c7g.medium via SSM Send Command.
#      The instance has no inbound ports - SSM is the only access path.
#
# Triggers on every push to main that touches simulation/ (so frontend-only
# changes don't redeploy the sim) plus a manual run from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'simulation/**'
      - '.github/workflows/deploy-simulation.yml'
  workflow_dispatch:

# Don't run two deploys at once. If a second push lands while one is in
# flight, queue it - never cancel an in-progress deploy mid-build, since
# the SSM command on the box can't be safely interrupted.
concurrency:
  group: deploy-simulation
  cancel-in-progress: false

jobs:
  # ── Stage 1: smoke build on the runner ─────────────────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache target/ + ~/.cargo so subsequent runs finish in seconds.
      # Keyed on Cargo.lock so dep bumps invalidate cleanly.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation -> target

      - name: cargo build --release
        working-directory: simulation
        run: cargo build --release --locked

      - name: cargo test
        working-directory: simulation
        run: cargo test --locked

  # ── Stage 2: trigger the prod rebuild via SSM ──────────────────────────────
  deploy:
    name: SSM rebuild + restart on EC2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25  # cargo build --release on c7g.medium can take ~10 min
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM deploy command
        id: send
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # The actual deploy: pull, rebuild release, restart systemd unit.
          # Using a single shell line so it runs in one /bin/sh invocation;
          # any step failing aborts the rest via && chaining.
          DEPLOY_CMD='cd /opt/thehumanbox && git pull --ff-only && cargo build --release --manifest-path simulation/Cargo.toml && systemctl restart simulation'

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"$DEPLOY_CMD\"]" \
            --output text --query 'Command.CommandId')

          echo "Command id: $CMD_ID"
          echo "cmd_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM command to finish
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          CMD_ID:      ${{ steps.send.outputs.cmd_id }}
        run: |
          set -euo pipefail

          # Poll until the command reaches a terminal state. SSM's built-in
          # `wait command-executed` only waits 100 attempts at 5 s = ~8 min,
          # which isn't enough headroom for a cold cargo build on the box.
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "::notice::SSM command succeeded"
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                echo "::error::SSM command finished with status: $STATUS"
                # Show what the box printed so the failure is debuggable from
                # the Actions log without having to SSM-shell into the host.
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                  --query '{status:Status, stdout:StandardOutputContent, stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                echo "Status: $STATUS - waiting..."
                sleep 5
                ;;
            esac
          done

          # Print the deploy script's stdout to the Actions log on success too,
          # so you can eyeball "Compiling..." progress and the systemctl confirm.
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
