name: lab-ci

on:
  pull_request:
    paths:
      - "lab/**"
      - ".github/workflows/lab-ci.yml"
  push:
    branches: [main]
    paths:
      - "lab/**"
      - ".github/workflows/lab-ci.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        working-directory: lab
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: lab
        run: |
          ruff check src tests scripts
      - name: Test
        working-directory: lab
        run: |
          pytest tests/ -v --tb=short
