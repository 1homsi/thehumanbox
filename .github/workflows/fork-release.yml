name: fork-release

# Builds the macOS (Apple Silicon) desktop app and uploads the .dmg and .zip
# to a GitHub Release of this repository. The app's updater reads the same
# releases. Started:
#
#   - by pushing a branch `release/vX.Y.Z`: the release and its tag are cut at
#     that branch's commit (for sessions that may push branches but not tags)
#   - by pushing a version tag, or publishing a release with a new tag in the
#     GitHub UI
#   - manually from the Actions tab (pass an existing tag; useful for
#     re-running a failed build)
#
# The version comes from the tag (v0.1.0 -> 0.1.0) and is stamped into
# apps/desktop/package.json at build time, so the committed version stays
# upstream's and upstream merges do not conflict on it.

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.1.0)'
        required: true

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Desktop ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-14
            sim_target: aarch64-apple-darwin
            bin_name: simulation-rs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve release tag and version
        id: tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG=${TAG#release/}
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag '$TAG' is not vX.Y.Z" >&2; exit 1; }
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

      # electron-builder names the artifacts and picks the release from this
      # version, and the updater compares it with the installed app's.
      - name: Stamp desktop version
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          jq --arg v "${{ steps.tag.outputs.version }}" '.version = $v' apps/desktop/package.json > "$tmp"
          mv "$tmp" apps/desktop/package.json
          echo "apps/desktop/package.json version → $(jq -r .version apps/desktop/package.json)"

      - name: Create the release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            # A release branch has no tag yet: the release creates it here.
            gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" \
              --notes "macOS (Apple Silicon) build. The app is not signed: on first launch right-click it and choose Open."
          fi

      # Most releases leave the simulation alone, and compiling it is the
      # slowest step. Key the binary on its sources (scripts/source-key.sh
      # ignores the release version stamps).
      - name: Simulation binary key
        id: sim-key
        shell: bash
        run: echo "key=sim-bin-${{ matrix.sim_target }}-$(scripts/source-key.sh crates apps/server Cargo.toml Cargo.lock)" >> "$GITHUB_OUTPUT"

      - name: Restore simulation binary
        id: sim-bin
        uses: actions/cache@v6
        with:
          path: target/${{ matrix.sim_target }}/release/${{ matrix.bin_name }}
          key: ${{ steps.sim-key.outputs.key }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.sim_target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.sim-bin.outputs.cache-hit != 'true'
        with:
          workspaces: .
          key: ${{ matrix.sim_target }}

      - name: Build simulation binary
        if: steps.sim-bin.outputs.cache-hit != 'true'
        shell: bash
        run: cargo build --release --locked --bin simulation-rs --target ${{ matrix.sim_target }}

      - name: Stage simulation binary into apps/desktop/resources/bin/
        shell: bash
        run: |
          mkdir -p apps/desktop/resources/bin
          cp target/${{ matrix.sim_target }}/release/${{ matrix.bin_name }} apps/desktop/resources/bin/

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build wasm sim-core (renderer imports it)
        shell: bash
        run: scripts/build-wasm.sh

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            apps/desktop/pnpm-lock.yaml

      - name: Install client deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build + package desktop
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
          # Code signing intentionally disabled for now — see apps/desktop/README.md
          # for the bypass instructions users get on first launch. When we
          # have certs, wire CSC_LINK / CSC_KEY_PASSWORD / WIN_CSC_LINK /
          # WIN_CSC_KEY_PASSWORD via repo secrets and flip the flags in
          # electron-builder.yml.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # `pnpm run release` builds the renderer (the client with
          # VITE_DESKTOP=1) itself, so the client is built once, here.
          VITE_GIT_SHA:      ${{ github.sha }}
        run: pnpm run release

      - name: Upload artifact (debug, if release upload fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}-out
          path: apps/desktop/out
          retention-days: 7
