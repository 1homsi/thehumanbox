name: wipe-world

# Manual-only workflow: terminates the live world.save on EC2 and
# restarts the simulation. Use when:
#   - A behaviour change is incompatible with the running save and you
#     want the next cold start to draw a fresh seed.
#   - You're showing the site to someone and want a pristine intro.
#
# Triggering: GitHub UI -> Actions -> wipe-world -> Run workflow.
# Requires typing `WIPE` in the confirmation input to defuse accidental
# clicks. There's no undo.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type WIPE to confirm. Any other value aborts.'
        required: true
        default: ''

jobs:
  wipe:
    name: Wipe + restart simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse unless explicitly confirmed
        if: ${{ github.event.inputs.confirm != 'WIPE' }}
        run: |
          echo "::error::Confirm input was '${{ github.event.inputs.confirm }}', expected 'WIPE'."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Send SSM wipe command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Cover the two most likely working dirs for the systemd unit.
          # rm -f is no-op on absent files so we don't fail on the wrong
          # path.
          WIPE='systemctl stop thehumanbox; rm -f /root/thehumanbox/world.save /root/thehumanbox/world.save.tmp /root/thehumanbox/world.save.bak /root/thehumanbox/simulation/world.save /var/lib/thehumanbox/world.save; systemctl start thehumanbox; sleep 2; systemctl status thehumanbox --no-pager | head -20'
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "wipe world + restart (manual via GH Actions)" \
            --parameters "commands=[\"$WIPE\"]" \
            --output text --query 'Command.CommandId')
          echo "SSM command dispatched: $CMD_ID"
          echo "Track: https://${{ vars.AWS_REGION }}.console.aws.amazon.com/systems-manager/run-command/$CMD_ID"

      - name: Wait for command completion
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Re-resolve the most recent command id we just sent. SSM
          # surfaces a status enum; we wait for one of the terminal
          # values and surface stdout for the run log.
          for _ in $(seq 1 24); do
            CMD_ID=$(aws ssm list-commands \
              --instance-id "$INSTANCE_ID" \
              --max-results 1 \
              --output text --query 'Commands[0].CommandId')
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --output text --query 'Status' 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "::notice::Wipe succeeded."
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output text --query 'StandardOutputContent'
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Wipe ended with status $STATUS."
                aws ssm get-command-invocation \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output text --query 'StandardErrorContent' || true
                exit 1
                ;;
              *)
                echo "  status: $STATUS"
                sleep 5
                ;;
            esac
          done
          echo "::warning::Did not see terminal status within polling window. Check AWS console."
