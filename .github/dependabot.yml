version: 2
updates:
  - package-ecosystem: cargo
    directory: /simulation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: sim(deps)
      include: scope

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
      react-three:
        patterns:
          - "@react-three/*"
          - "three"
          - "@types/three"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: client(deps)
      include: scope

  - package-ecosystem: pip
    directory: /lab
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      pip-minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: lab(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: ci(deps)
      include: scope
