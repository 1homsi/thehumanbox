[package]
name = "headless"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "headless"
path = "src/main.rs"

[dependencies]
sim-core   = { path = "../sim-core" }
serde_json = "1"

[features]
# Spread a tick across cores, as the desktop and the server do. `--no-default-features` runs it on one
# thread, as the web build does; both must give the same world.
default = ["parallel"]
parallel = ["sim-core/parallel"]
